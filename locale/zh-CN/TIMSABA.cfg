[mod-setting-description]
setting-early-sintering-oven=将烧结炉的解锁位置提前。
setting-no-spoilage=禁用所有物品的腐坏，防止其转化为变质物。
setting-early-cliff-explosives=将悬崖炸药的解锁位置提前。
setting-science-pack-nostalgia=使用旧版科技包外观替换新版科技包外观。
setting-multi-building=允许将蒸汽机、汽轮机、太阳能板和蓄电器组合成紧凑的双联或四联建筑。
setting-dynamic-underground-belts=地下传送带最远可连接N格，并按实际铺设距离消耗普通传送带。
setting-dynamic-pipe-to-ground=地下管道最远可连接N格，并按实际铺设距离消耗普通管道。
setting-real-incineration=启用后，仅允许焚烧现实中可燃的物品。
setting-rebalance-belts-and-pipes=启用后，将地下传送带和地下管道的连接距离设为固定值。
setting-flow-control-new=添加连接方向受限的管道，方便铺设互不相连的平行管线。
setting-defrost-multiplier=设定冷冻物品的解冻时间倍率。基准时间取自原物品的腐坏时间。最大值720可使原本能保存12小时的物品在冷冻后保存约一年（现实时间）。
setting-game-difficulty=选择本次游戏的难度。
setting-early-quality=将品质科技的解锁位置提前。
setting-loot-from-spaceship=启用后，回收飞船及其残骸时可获得基础起始资源。战利品数量由“游戏难度”设置决定。
setting-space-connection-multiplier-length=用于星球间计算距离的倍率。数值越大，航程越远，航行时间越长。
setting-space-connection-use-line=启用后，按直线最短路径计算星球之间的航线。关闭时，按轨道弧线计算。
setting-space-connection-all=启用后，添加额外的星际航线。

setting-za-horogon-extra-science-packs=为MK5至MK6科技添加低温和钷素科技包需求，为等离子武器添加冶金和电磁科技包需求，为MK3之后的电池和激光科技添加电磁科技包需求。
setting-zb-horogon-high-tier-recipes=在高等级电池、太阳能板、汽轮机、反应堆和插件的配方中加入太空时代材料。科技包需求添加至对应科技。
setting-zc-horogon-module-planet-lock=在高等级插件科技中加入对应星球的太空时代科技包需求。
setting-zd-horogon-tier-technology-costs=为兼容旧存档而保留的开关。Horogon平衡调整现已始终采用下方按类别分别设置的MK1至MK6费用倍率。
setting-zi-horogon-mech-armor-technology-cost=设定机甲装甲科技的固定科研费用。如果启用下方选项，能量装甲MK5至MK1的费用将逐级取上一等级的75%。
setting-zj-horogon-power-armor-chain-from-mech=启用后，能量装甲的科研费用以机甲装甲为基准推算。MK5为机甲装甲的75%，MK4为MK5的75%，依此类推至MK1。

