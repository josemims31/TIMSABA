angelsaddons-storage=添加多种天使风格的筒仓、仓库和压力储罐，可独立于天使模组组使用。
angelsaddons-storage-notes=\n\n[font=default-bold]提示[/font]：筒仓占地4×4，拥有240个储物格，物流版本的容量有所不同。\n[font=default-bold]提示[/font]：仓库占地6×6，拥有960个储物格，物流版本的容量有所不同。\n[font=default-bold]提示[/font]：储液罐的容量高于原版。

angels-ore-sorting=矿石分选设备集重力分离、离心分离和筛分于一体，可将精炼后的复合矿分离成各类单质矿石，再用于冶炼高品质金属。
angels-ore-sorting-vanilla=\n\n分选设施可将不同精炼阶段的四种复合矿分选为可冶炼矿石、矿粒和矿砾，各阶段产物比例不同。矿粒和矿砾可进一步转化为金属矿石。纯净矿可提供更多可冶炼矿石，同时也会产生金属渣。
angels-ore-sorting-overhaul=\n\n分选设施可将不同精炼阶段的六种主要矿石分选为多种金属矿石。\n4个[img=item/angels-ore4-crushed]碎矿产出2个主要矿石、1个次要矿石和1个[item=angels-slag]。\n8个[img=item/angels-ore4-chunk]矿块产出4个主要矿石、2个次要矿石、2个其他矿石和1个[item=angels-slag]。\n8个[img=item/angels-ore4-crystal]矿石晶体产出4个主要矿石、2个次要矿石、3个其他矿石和1个[item=angels-slag]。\n8个[img=item/angels-ore4-pure]纯净矿产出4个主要矿石、2个次要矿石和4个其他矿石。\n\n将鼠标悬停在地表矿藏上，可查看其分选产物。\n主要和次要产物如下：\n- [item=angels-ore1]和[item=angels-ore2]：主要产出[item=iron-ore]，次要产出[item=copper-ore]\n- [item=angels-ore3]和[item=angels-ore4]：主要产出[item=copper-ore]，次要产出[item=iron-ore]\n- [item=angels-ore5]和[item=senaite-ore]：主要产出[item=bob-lead-ore]，次要产出[item=angels-manganese-ore]\n- [item=angels-ore6]和[item=franckeite-ore]：主要产出[item=bob-tin-ore]，次要产出[item=magnesium-ore]
angels-ore-sorting-bobs=\n\n分选设施可将不同精炼阶段的六种主要矿石分选为多种金属矿石。\n4个[img=item/angels-ore4-crushed]碎矿产出2个主要矿石、1个次要矿石和1个[item=angels-slag]。\n8个[img=item/angels-ore4-chunk]矿块产出4个主要矿石、2个次要矿石、2个其他矿石和1个[item=angels-slag]。\n8个[img=item/angels-ore4-crystal]矿石晶体产出4个主要矿石、2个次要矿石、3个其他矿石和1个[item=angels-slag]。\n8个[img=item/angels-ore4-pure]纯净矿产出4个主要矿石、2个次要矿石和4个其他矿石。\n\n将鼠标悬停在地表矿藏上，可查看其分选产物。\n主要和次要产物如下：\n- [item=angels-ore1]和[item=angels-ore2]：主要产出[item=iron-ore]，次要产出[item=copper-ore]\n- [item=angels-ore3]和[item=angels-ore4]：主要产出[item=copper-ore]，次要产出[item=iron-ore]\n- [item=angels-ore5]和[item=senaite-ore]：主要产出[item=bob-lead-ore]，次要产出[item=angels-manganese-ore]\n- [item=angels-ore6]和[item=franckeite-ore]：主要产出[item=bob-tin-ore]，次要产出[item=magnesium-ore]

angels-air-filtering-notes=\n\n[font=default-bold]提示[/font]：地球大气中约有21%的氧气和79%的氮气。\n此模组采用的比例略有不同。
