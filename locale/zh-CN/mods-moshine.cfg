[tips-and-tricks-item-description]
moshine-briefing=[planet=moshine]是一颗炎热的火山星球，富含[item=angels-solid-sand]，可用于生产[item=silicon]和[item=bob-glass]，还有适合制造[item=magnet]的[item=neodymium-ore]。高温使[entity=accumulator]的建造十分困难，幸好四处都有高温[entity=steam-geyser]。建议至少带一台[entity=foundry]，以便处理熔岩湖中的[fluid=lava]。

