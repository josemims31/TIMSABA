[entity-description]
muluna-vacuum-heating-tower=以更高的效率燃烧基础和高级燃料来产生热量。可在所有表面使用，但需要消耗[fluid=angels-gas-oxygen]，并产出[fluid=angels-gas-carbon-dioxide]。
muluna-cycling-steam-turbine=效率更高的汽轮机，可将部分消耗的蒸汽冷凝回水，重新加热使用。优先使用品质更高的蒸汽。\n[fluid=steam]最高温度为915°C\n[fluid=cooled-steam]最低温度为100°C

