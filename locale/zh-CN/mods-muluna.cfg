[technology-description]
muluna-greenhouses=专用温室生产[item=wood]和[fluid=angels-gas-oxygen]的速度远快于化工厂，但使用前需要投入[item=angels-solid-tree]作为种源。
muluna-wood-cultivation=在[entity=muluna-greenhouse-wood]中培育[item=wood]。容易建设，但生产速度较慢。消耗[fluid=angels-gas-carbon-dioxide]并产出[fluid=angels-gas-oxygen]。
muluna-anorthite-processing=从[item=anorthite-chunk]中提炼铝，用作[item=rocket-fuel]，并为制造[item=aluminum-cable]提供原料。
muluna-regolith-digging=将采矿机放在[planet=muluna]上附近没有矿藏的位置，即可开采月壤。

[tips-and-tricks-item-description]
muluna-briefing=[planet=muluna]是一片无边的灰色岩石荒原。地表遍布富含金属、燃料和水的陨石，须先用[entity=crusher]粉碎才能提取资源。\n[entity=metallic-asteroid-chunk]是[item=iron-ore]的主要来源。[entity=carbonic-asteroid-chunk]可提供[item=coal]等化学燃料。\n[entity=oxide-asteroid-chunk]是[item=ice]的主要来源。[entity=anorthite-chunk]可提供制造[item=aluminum-cable]和[item=rocket-fuel]所需的原料。\n缺少人工提供的[fluid=oxygen]时，燃料无法燃烧。要在这里生产石油产品，需要掌握更先进的技术。
