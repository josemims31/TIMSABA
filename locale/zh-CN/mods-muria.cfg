[item-description]
inert-acidworking-science-pack=需要使用[fluid=angels-gas-hydrogen-chloride]激活其中的化学反应。

[fluid-name]
hydronium=水合氢离子溶液

muria-air=穆里亚空气

[recipe-name]
muria-air-separation=穆里亚空气分离

[technology-description]
lichen-cultivation=[item=acidophile-lichen]似乎以[item=chlorine-salts]中的金属脱去[fluid=angels-gas-chlorine]时释放的能量为食。将这些盐放在[tile=acidophile-lichen]上，可稳定地获取此星球的金属。不过，地衣菌落会向空气中释放强腐蚀性物质，危及工厂。
lead-processing=将从[fluid=muriatic-solution]中提取的[item=cotunnite]放在[tile=acidophile-lichen]上，释放其中的[item=bob-lead-ore]，开始加工这种耐腐蚀金属。
advanced-lead-processing=利用[item=chloric-fuel]，可在专用的[entity=smelting-plant]中采用更高级的[item=bob-lead-ore]加工工艺，并解锁铅球团和重型霰弹的生产。
offworld-chlorine-compounds-production=解锁在[planet=muria]之外获取和加工[fluid=angels-gas-chlorine]与[fluid=angels-gas-hydrogen-chloride]的工艺。
hydrogen-chloride-explosives=利用[fluid=angels-gas-hydrogen-chloride]的特性生产[item=explosives]的替代配方。
hydrogen-chloride-from-biter-egg=小心提取生长中的撕咬虫和喷吐虫的产酸腺体，可在新地星便捷地获取[fluid=angels-gas-hydrogen-chloride]。

[tile-description]
muriatic-solution=由[fluid=angels-gas-chlorine]和[fluid=hydronium]组成的溶液，散布着[item=cotunnite]块。可将资源投入其中销毁。

[tips-and-tricks-item-description]
muria-briefing=[planet=muria]是一个剧毒却生机盎然的世界。干燥陆地覆盖着[tile=acidophile-lichen]和[entity=eschatotaxite]真菌，其余地表则布满[fluid=muriatic-solution]湖泊。[entity=chlorine-salt-deposit]和[item=cotunnite]是含[fluid=angels-gas-chlorine]的盐类，可在地表通过不同方式获取。利用[entity=fungicultural-tower]和地衣可从这些盐类中提炼矿石。注意地衣释放的腐蚀性气体，巨型真菌可保护工厂免受其伤害。
