[technology-description]
planet-discovery-paracelsin=一片冰火山活动极为频繁的冰冻荒原。地下海洋中的[fluid=nitrogen-liquid]涌出地表，形成大片湖泊。[entity=cryovolcanic-vent]遍布地表，附近分布着提取[item=bob-zinc-ore]所需的[item=tetrahedrite]和[item=sphalerite]矿脉，以及少量[item=vaterite]矿脉。此处的建筑必须持续供暖，否则会冻结。锌提炼过程中产生的各种无用副产物也必须妥善处理。
zinc-extraction=解锁以锌制造的各种产品。
galvanized-steel=在[item=steel-plate]表面镀上[fluid=angels-liquid-molten-zinc]，提高其强度和耐腐蚀性。
nitric-acid-handling=研究[entity=big-metallic-rock]上自发发生的化学反应，并利用同样的原理生产[fluid=angels-liquid-nitric-acid]。
zinc-piping=由[item=bob-zinc-plate]制成的坚固保温管道。在[planet=paracelsin]或[planet=aquilo]等寒冷表面不会冻结，地下输送距离也更长。

[space-location-description]
paracelsin=一片冰火山活动极为频繁的冰冻荒原。地下海洋中的[fluid=nitrogen-liquid]涌出地表，形成大片湖泊。[entity=cryovolcanic-vent]遍布地表，附近分布着提取[item=bob-zinc-ore]所需的[item=tetrahedrite]和[item=sphalerite]矿脉，以及少量[item=vaterite]矿脉。此处的建筑必须持续供暖，否则会冻结。锌提炼过程中产生的各种无用副产物也必须妥善处理。

[tile-description]
nitrogen-lake=覆盖[planet=paracelsin]地表的液态[fluid=nitrogen-liquid]湖泊。与[planet=aquilo]的[tile=ammoniacal-ocean]不同，这些湖泊较浅，可以使用[tile=landfill]填埋。

[tips-and-tricks-item-description]
paracelsin-briefing=[planet=paracelsin]像[planet=aquilo]一样是一片冰冻荒原，但拥有坚实的地表。地下存在巨大的[fluid=nitrogen-liquid]海洋，涌出地表后形成[tile=nitrogen-lake]。这里富含[item=zinc]的化合物[item=sphalerite]和[item=tetrahedrite]，以及[item=vaterite]。地表还遍布[entity=cryovolcanic-vent]。

