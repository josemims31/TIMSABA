[tips-and-tricks-item-description]
pelagos-briefing-main=[planet=pelagos]是一个群岛世界，富含热带[entity=coconut-palm]、[entity=angels-gas-methane]、[entity=iron-ore]，还有[entity=fish]和[entity=copper-biter-spawner]等小型生命，后者是这里的铜来源。采收椰子，加工成油、密封剂和生物燃料，探索发酵工艺，并利用高温[entity=calciner]精炼原料。
pelagos-calciners=[entity=calciner]通过高温净化，将原料转化为精炼矿物。\n煅烧炉可以消耗任何具有燃料热值的流体，例如[fluid=crude-oil]、[fluid=angels-gas-methane]、[fluid=coconut-oil]和[fluid=angels-gas-ethanol]等。\n流体的燃料热值越高，处理相同数量材料所需的燃料越少。可用来处理椰壳、木材、鱼类，以及其他需要高温加工的资源。
