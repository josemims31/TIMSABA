[technology-description]
s1_algea_culturing=灶神星的大气中生活着大量微生物。可从各种气体中提取微量的微生物，再仔细培养。这是我们在此获取资源的唯一途径。
s1_dueterium=解锁从灶神星大气中提取氢同位素——氘和氚——的技术。
s1_algea_extracting=灶神星上的藻类适应能力极强。提供特定气体和热量后，它们会改变自身组成，像句芒星的细菌一样生成金属化合物。
s1_gas_manipulation_science_pack=研究和改进各种气体处理技术。
s2_plateworkings=氢气和氧气有助于矿石冶炼。利用两者燃烧，可提高铁、铜等基础金属的产量。
s2_fusion_enhancements=解锁更远距离的等离子体输送技术。
ske_fusion_thruster=进一步升级推进器，利用等离子体推动太空平台，以更高的能源效率飞得更快、更远。

iridium-smelting-1=采用高级加工工艺生产铱。
iridium-smelting-2=增加加工工序，减少材料损耗。
iridium-smelting-3=增加加工工序，减少材料损耗。
