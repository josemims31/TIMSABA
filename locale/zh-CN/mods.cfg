[string-mod-setting-description]
mdrn-chute-mode-none=禁用溜槽装载机。
mdrn-chute-mode-basic-limited=启用溜槽装载机的输入功能。
mdrn-chute-mode-basic=启用溜槽装载机的输入和输出功能。
mdrn-chute-mode-filtered=启用溜槽装载机的输入、输出和筛选功能。
mdrn-chute-direction-input=溜槽装载机仅能将传送带上的物品装入容器。
mdrn-chute-direction-input-output=溜槽装载机可将传送带上的物品装入容器，也可将容器内的物品卸到传送带上。
