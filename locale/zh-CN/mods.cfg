kry-asteroid-belt=○🌐改良小行星带

[mod-description]
TIMSABA=Tachigami Itsuki为太空时代、Bob和天使模组制作的整合包。\n整合太空时代与天使、Bob模组的生产流程。\n统一平衡，加入新的建筑、物品、流体、配方和科技，并更新图标。
PlanetsLibTiers=这是PlanetsLib的配套模组，为各星球分配“阶段等级”，粗略标示其在接近原版太空时代流程中的位置，供其他模组使用。\n\nPlanetsLib: Tiers独立于PlanetsLib发布，以便单独更新。你可以固定此模组的版本来保持阶段等级稳定，除非其他模组修改这些等级。

