[tips-and-tricks-item-description]
fulgora-briefing=[planet=fulgora]是一颗干燥荒芜、没有生命迹象的星球。频繁的夜晚伴随着危险的雷电。\n[entity=solar-panel]效率很低，但可用[entity=lightning-rod]收集雷电，并将电能储存在[entity=accumulator]中。\n这里没有天然矿藏，只有以[entity=scrap]形式残留的遗物。\n昔日的海洋如今充满了[fluid=angels-liquid-multi-phase-oil]，可通过[entity=offshore-pump]抽取。\n[tile=oil-ocean-shallow]需要到后期才能填埋，前期可用高架铁路跨越。在深海区域放置[entity=rail-support]需要额外研究。
