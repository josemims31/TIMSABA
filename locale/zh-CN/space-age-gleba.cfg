[tips-and-tricks-item-description]
gleba-briefing=[planet=gleba]是一颗潮湿的沼泽星球，拥有丰富的异星植被，可用[entity=agricultural-tower]种植，并在[entity=biochamber]中加工。\n这里没有[entity=angels-ore1]、[entity=angels-ore2]、[entity=angels-ore3]、[entity=angels-ore4]、[entity=angels-ore5]、[entity=angels-ore6]、[entity=senaite-ore]、[entity=franckeite-ore]、[entity=coal]、[entity=crude-oil]、[entity=angels-natural-gas]和[entity=angels-fissure]，但可通过植物获得所需物资。\n多数农产品会随时间腐坏，就连[item=agricultural-science-pack]也有保质期，无法长期囤积。\n大型五足生物是这里的原生物种。[entity=solar-panel]效率较低，但仍可使用。
