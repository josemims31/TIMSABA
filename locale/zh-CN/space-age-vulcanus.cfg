[tips-and-tricks-item-description]
vulcanus-briefing=[planet=vulcanus]是一颗炎热且没有[fluid=water]的星球。这里没有[entity=crude-oil]、[entity=angels-natural-gas]和[entity=angels-fissure]，但拥有多种新的[tooltip=resources,tips-and-tricks-item-description.vulcanus-resources]。\n[fluid=lava]可无限提供矿物，用于替代[entity=angels-ore1]、[entity=angels-ore2]、[entity=angels-ore3]、[entity=angels-ore4]、[entity=angels-ore5]、[entity=angels-ore6]、[entity=senaite-ore]和[entity=franckeite-ore]矿床。这些矿石的原矿只能在[entity=big-rock]中找到。\n[entity=solar-panel]效率显著提高。这里环境恶劣，遍布火山、熔岩河、灰烬平原和硫酸喷泉。\n[tile=lava]需要到后期才能填埋，前期可用高架铁路跨越。
